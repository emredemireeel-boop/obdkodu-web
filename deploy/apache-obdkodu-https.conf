<VirtualHost *:80>
    ServerName www.obdkodu.com
    ServerAlias obdkodu.com
    DocumentRoot /var/www/obdkoduwebb/dist

    <Directory /var/www/obdkoduwebb/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://www.obdkodu.com%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName obdkodu.com
    DocumentRoot /var/www/obdkoduwebb/dist

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/obdkodu.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/obdkodu.com/privkey.pem

    RewriteEngine On
    RewriteRule ^ https://www.obdkodu.com%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.obdkodu.com
    DocumentRoot /var/www/obdkoduwebb/dist
    DirectoryIndex index.html
    ErrorDocument 404 /404.html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/obdkodu.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/obdkodu.com/privkey.pem

    <Directory /var/www/obdkoduwebb/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPassReverse / http://127.0.0.1:3000/
    RewriteEngine On
    Include /var/www/obdkoduwebb/deploy/apache-route-rules.conf

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Strict-Transport-Security "max-age=15552000"
    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/json application/xml

    ErrorLog ${APACHE_LOG_DIR}/obdkodu-error.log
    CustomLog ${APACHE_LOG_DIR}/obdkodu-access.log combined
</VirtualHost>
